# meow-push-bridge / MeoW Push Bridge (喵桥) —— 源码调试用配置补丁
#
# 用途：不安装、不构建，直接把本仓库的 TypeScript 源码挂进 profile 调试。
#       Loader 会直接加载 ./src/index.ts，配合 dsh-hmr 保存即热重载。
#
# 用法：把下面内容复制进 profile 的 cordis.patch.yml（或作为 --patch 叠加层）：
#       dsh --profile web --patch ./cordis.debug.patch.yml
#
# 与 cordis.patch.yml 的唯一区别是 name：这里指向源码，那里指向包名。
#
# 配置面刻意保持最小：**只有昵称需要填写**（其余请求细节已固化，见 src/config.ts）。
# ────────────────────────────────────────────────────────────────

- insert:
    - id: meow-push-bridge
      name: ./src/index.ts
      config:
        # 【必填】你的 MeoW 用户昵称（官方文档：不允许包含斜杠）
        nickname: ""
