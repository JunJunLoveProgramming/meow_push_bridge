# dsh-junjun-transit / 骏骏通知中转 —— 发布用配置补丁
#
# 本文件是 DSH 的「插件配置补丁」（cordis patch）。作为 Bundle 安装后，DSH 的
# Loader 会把它叠加到 profile 配置层上，插入本插件并注入 config。
#
# ⚠️ name 必须是包名（解析到 package.json 的 main → ./dist/index.js）。
#    源码调试请改用同目录的 cordis.debug.patch.yml（那里 name 为 ./src/index.ts）。
#    原因：npm 包的 files 白名单只含 dist/，装到 profile 后并没有 src/ 目录。
#
# ⚠️ MeoW 昵称可为空：只要 SMTP 或 Bark 已配置，插件仍会注册 dsh_junjun_transit 工具。
#    三种通道至少配置一种即可推送；修改昵称后保存设置或重启 dsh 即可生效。
#
# 0.5.1：项目更名为 dsh-junjun-transit（骏骏通知中转）。
# 主题（标题 / 图标 URL / 分类）保存在宿主安全存储，不写入本文件。
# ────────────────────────────────────────────────────────────────

- insert:
    - id: dsh-junjun-transit
      name: dsh-junjun-transit
      config:
        # 你的 MeoW 用户昵称，对应推送地址 https://api.chuckfang.com/{昵称}/...
        # 官方文档：昵称不允许包含斜杠。可留空，改用 SMTP / Bark。
        nickname: ""
